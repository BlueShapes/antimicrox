name: Release
on:
    release:
        types: [published]
    # Forks can fail to enqueue release events even while Actions is enabled.
    # Keep a manual, tag-scoped fallback so official artifacts can still be
    # built from the exact commit named by an existing release.
    workflow_dispatch:
        inputs:
            release_tag:
                description: Existing GitHub release tag to build and upload
                required: true
                type: string

env:
    RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

concurrency:
    group: release-${{ github.event.release.tag_name || inputs.release_tag }}
    cancel-in-progress: false

jobs:
    validate-release:
        name: Validate release tag and Build gate
        runs-on: ubuntu-24.04
        permissions:
            actions: read
            contents: read
        outputs:
            release_commit: ${{ steps.resolve.outputs.release_commit }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: refs/tags/${{ env.RELEASE_TAG }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Resolve and validate release
              id: resolve
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  RELEASE_COMMIT="$(git rev-parse HEAD)"
                  MAJOR="$(sed -n 's/^set(ANTIMICROX_MAJOR_VERSION \([^)]*\))$/\1/p' CMakeLists.txt)"
                  MINOR="$(sed -n 's/^set(ANTIMICROX_MINOR_VERSION \([^)]*\))$/\1/p' CMakeLists.txt)"
                  PATCH="$(sed -n 's/^set(ANTIMICROX_PATCH_VERSION \([^)]*\))$/\1/p' CMakeLists.txt)"
                  PRERELEASE="$(sed -n 's/^set(ANTIMICROX_PRERELEASE_VERSION "\([^"]*\)")$/\1/p' CMakeLists.txt)"
                  SOURCE_VERSION="$MAJOR.$MINOR.$PATCH"
                  if [[ -n "$PRERELEASE" ]]; then
                      SOURCE_VERSION="$SOURCE_VERSION-$PRERELEASE"
                  fi

                  test "$RELEASE_TAG" = "v$SOURCE_VERSION"
                  test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease)')" = "false"
                  test "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow main.yml --commit "$RELEASE_COMMIT" --limit 20 --json status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')" -gt 0
                  echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

    # Windows and AppImage artifacts bundle Qt 6.10.2. Qt 5 compatibility
    # builds in main.yml are never used to produce official release artifacts.
    # Build .deb files for debian-based systems.
    build_deb:
        needs: validate-release
        permissions:
            contents: write
        strategy:
          fail-fast: false
          matrix: 
            include:
              # - name: Ubuntu 26-04
              #   image: ubuntu-26.04
              - name: Ubuntu 24-04
                image: ubuntu-24.04
              - name: Ubuntu 22-04
                image: ubuntu-22.04
        name: Build deb package ${{ matrix.name }}
        runs-on: ${{ matrix.image }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.validate-release.outputs.release_commit }}
                  persist-credentials: false

            - name: Install Dependencies with QT6
              run: sudo apt-get update && sudo apt-get install extra-cmake-modules qt6-base-dev qt6-l10n-tools qt6-tools-dev-tools libqt6core5compat6-dev qt6-tools-dev libsdl2-dev libxi-dev libxtst-dev libx11-dev itstool gettext

            - name: Configure CMake
              run: cmake -DCPACK_GENERATOR="DEB" -DCMAKE_BUILD_TYPE=Release -DCHECK_FOR_UPDATES=ON -DANTIMICROX_PKG_VERSION="GitHub deb Release" -B ${{ github.workspace }}/build

            - name: Run focused release tests
              run: |
                  cmake --build ${{ github.workspace }}/build --target ProductIdentityTests SecurityPolicyTests --parallel 8
                  ctest --test-dir ${{ github.workspace }}/build --output-on-failure -R "ProductIdentityTests|SecurityPolicyTests"

            - name: Create Deb package
              id: create_deb
              run: cmake --build ${{ github.workspace }}/build --parallel 8 --target package

            - name: Rename deb files
              id: rename_debs
              run: |
                FILE=`find ${{ github.workspace }}/build/*.deb`
                NEWFILE=`echo $FILE | sed 's/x86_64/${{ matrix.image }}-x86_64/'`
                mv $FILE $NEWFILE

            # Upload generated files to release
            - name: Upload binaries to release
              run: gh release upload "$RELEASE_TAG" "${{ github.workspace }}"/build/*.deb --clobber
              env:
                  GH_TOKEN: ${{ github.token }}

    # Build universal and portable AppImage package.
    build-appimage:
        needs: validate-release
        permissions:
            contents: write
        # Version of ubuntu building this appimage, it shouldn't be the latest verion of ubuntu to avoid breaking compatibility with older systems
        name: Build AppImage package
        runs-on: ubuntu-24.04

        steps:

            - name: Install Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install extra-cmake-modules qt6-base-dev qt6-tools-dev-tools libqt6core5compat6-dev qt6-tools-dev libsdl2-dev libxi-dev libxtst-dev libx11-dev itstool gettext zsync libfuse-dev

            #Replace original library with the newer one
            - name: Build and install newer SDL2
              run: |
                git clone --filter=blob:none --no-checkout https://github.com/libsdl-org/SDL.git
                git -C SDL checkout --detach 5d249570393f7a37e037abf22cd6012a4cc56a71
                cd SDL
                mkdir build
                cd build
                cmake ..
                cmake --build .
                sudo cmake --install .
                sudo cp /usr/local/lib/libSDL2-2.0.so.0 /usr/lib/x86_64-linux-gnu/libSDL2-2.0.so.0

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.validate-release.outputs.release_commit }}
                  persist-credentials: false

            - name: Install bundled Qt
              uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
              with:
                  version: "6.10.2"
                  host: "linux"
                  target: "desktop"
                  arch: "linux_gcc_64"
                  modules: "qt5compat"
                  install-deps: "true"

            - name: Prepare files needed to create AppImage
              run: |
                  mkdir build && cd ./build
                  wget https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
                  wget https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
                  wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
                  wget https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
                  echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum --check --strict
                  echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum --check --strict
                  echo "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum --check --strict
                  echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64" | sha256sum --check --strict
                  chmod +x linuxdeploy-x86_64.AppImage
                  chmod +x appimagetool-x86_64.AppImage
                  chmod +x linuxdeploy-plugin-qt-x86_64.AppImage

            - name: Build AntiMicroX-Delta
              run: |
                  MAJOR="$(sed -n 's/^set(ANTIMICROX_MAJOR_VERSION \([^)]*\))$/\1/p' CMakeLists.txt)"
                  MINOR="$(sed -n 's/^set(ANTIMICROX_MINOR_VERSION \([^)]*\))$/\1/p' CMakeLists.txt)"
                  PATCH="$(sed -n 's/^set(ANTIMICROX_PATCH_VERSION \([^)]*\))$/\1/p' CMakeLists.txt)"
                  cd build
                  cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}/lib/cmake" -DANTIMICROX_PKG_VERSION="$MAJOR.$MINOR.$PATCH-x86_64 GitHub AppImage Release"
                  cmake --build . --target ProductIdentityTests SecurityPolicyTests --parallel 8
                  ctest --output-on-failure -R "ProductIdentityTests|SecurityPolicyTests"
                  make install DESTDIR=AppDir -j8

            # UPDATE_INFORMATION describes where information about updates can be found
            - name: Create AppImage file
              run: |
                  cd build
                  export PATH="${QT_ROOT_DIR}/bin:${PATH}"
                  export CMAKE_PREFIX_PATH="${QT_ROOT_DIR}/lib/cmake"
                  export UPDATE_INFORMATION="zsync|https://github.com/$GITHUB_REPOSITORY/releases/latest/download/AntiMicroX-Delta-x86_64.AppImage.zsync"
                  ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt
                  ./appimagetool-x86_64.AppImage --runtime-file runtime-x86_64 AppDir/ -u "$UPDATE_INFORMATION"

            # Upload generated files to release
            - name: Upload binaries to release
              run: gh release upload "$RELEASE_TAG" ./build/AntiMicroX-Delta*.AppImage ./build/AntiMicroX-Delta*.zsync --clobber
              env:
                  GH_TOKEN: ${{ github.token }}

            - name: Build AntiMicroX-Delta-debug
              run: |
                  MAJOR="$(sed -n 's/^set(ANTIMICROX_MAJOR_VERSION \([^)]*\))$/\1/p' CMakeLists.txt)"
                  MINOR="$(sed -n 's/^set(ANTIMICROX_MINOR_VERSION \([^)]*\))$/\1/p' CMakeLists.txt)"
                  PATCH="$(sed -n 's/^set(ANTIMICROX_PATCH_VERSION \([^)]*\))$/\1/p' CMakeLists.txt)"
                  cd build
                  cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}/lib/cmake" -DANTIMICROX_PKG_VERSION="$MAJOR.$MINOR.$PATCH-debug-x86_64 \(AppImage-debug\)"
                  make install DESTDIR=AppDir -j8

            - name: Create AppImage debug file
              run: |
                  cd build
                  export PATH="${QT_ROOT_DIR}/bin:${PATH}"
                  export CMAKE_PREFIX_PATH="${QT_ROOT_DIR}/lib/cmake"
                  ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt
                  ./appimagetool-x86_64.AppImage --runtime-file runtime-x86_64 AppDir/
                  mv AntiMicroX-Delta-x86_64.AppImage AntiMicroX-Delta-debug-x86_64.AppImage

            # Upload generated files to release
            - name: Upload binaries to release
              run: gh release upload "$RELEASE_TAG" ./build/AntiMicroX-Delta-debug-x86_64.AppImage --clobber
              env:
                  GH_TOKEN: ${{ github.token }}

    build-windows-packages:
        needs: validate-release
        permissions:
            contents: write
        name: Create Windows packages
        runs-on: windows-2022
        defaults:
            run:
                shell: msys2 {0}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.validate-release.outputs.release_commit }}
                  persist-credentials: false

            - name: Install Dependencies
              uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
              with:
                  install: >-
                      mingw-w64-x86_64-toolchain
                      mingw-w64-x86_64-ninja
                      mingw-w64-x86_64-nsis
                      mingw-w64-x86_64-openssl
                      mingw-w64-x86_64-cmake
                  msystem: mingw64
                  release: false
            # mingw-w64-x86_64-SDL2 not installed above because of: https://github.com/AntiMicroX/antimicrox/issues/465
            # SDL2 version for release locked
            - name: Install sdl2
              run: |
                curl -L -o mingw-w64-x86_64-SDL2-2.32.10-1-any.pkg.tar.zst https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-SDL2-2.32.10-1-any.pkg.tar.zst
                echo "5991afbcfeb2f8b838ab80b2270d713a727199ca392715677a7c1931a0d9ecef  mingw-w64-x86_64-SDL2-2.32.10-1-any.pkg.tar.zst" | sha256sum --check --strict
                pacman --noconfirm -U mingw-w64-x86_64-SDL2-2.32.10-1-any.pkg.tar.zst

            - name: Install Qt
              uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
              with:
                  version: "6.10.2"
                  host: "windows"
                  target: "desktop"
                  arch: "win64_mingw"
                  dir: "${{ github.workspace }}/qt/"
                  install-deps: "true"

            - name: Configure CMake
              run: cmake -DCMAKE_BUILD_TYPE=Release -DCHECK_FOR_UPDATES=ON -DANTIMICROX_PKG_VERSION="GitHub Windows Release" -B '${{ github.workspace }}'/build
              env:
                  CMAKE_PREFIX_PATH: "${{ env.QT_ROOT_DIR }}/lib/cmake"

            - name: Run focused release tests
              run: |
                  cmake --build '${{ github.workspace }}'/build --target ProductIdentityTests SecurityPolicyTests --parallel 8
                  QT_BIN="$(cygpath -u "$QT_ROOT_DIR")/bin"
                  PATH="$QT_BIN:$PATH" ctest --test-dir '${{ github.workspace }}'/build --output-on-failure -R "ProductIdentityTests|SecurityPolicyTests"

            - name: Build Installer
              run: cmake --build '${{ github.workspace }}'/build --target package --parallel 8

            # Do not publish a Portable Windows archive: DLL search and
            # loading occur before application startup policy can run.
            - name: Upload installer to release
              shell: pwsh
              run: |
                  $installer = @(Get-ChildItem -Path "${{ github.workspace }}/build" -Filter "antimicrox-delta*.exe" -File)
                  if ($installer.Count -ne 1) {
                      throw "Expected exactly one Windows installer, found $($installer.Count)."
                  }
                  gh release upload $env:RELEASE_TAG $installer[0].FullName --clobber
              env:
                  GH_TOKEN: ${{ github.token }}
